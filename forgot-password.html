<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset your Elite Bridge password</title><style>
:root{--green:#063e2c;--green2:#0b513a;--gold:#c88b2c;--ink:#15231d;--muted:#69766f;--line:#dfe7e3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;color:var(--ink);background:radial-gradient(circle at 10% 0,rgba(200,139,44,.18),transparent 30%),linear-gradient(145deg,#edf6f1,#f7f3eb);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(460px,100%);padding:34px;border:1px solid #e1e8e4;border-radius:22px;background:#fff;box-shadow:0 24px 70px rgba(18,43,33,.13)}img{width:185px;height:auto}h1{margin:30px 0 9px;color:var(--green);font-size:31px;letter-spacing:-.035em}p{color:var(--muted);line-height:1.55}.field{margin:24px 0 18px}label{display:block;margin-bottom:8px;font-size:13px;font-weight:750}input{width:100%;height:52px;padding:0 14px;border:1px solid var(--line);border-radius:11px;font:inherit}input:focus{outline:0;border-color:var(--green2);box-shadow:0 0 0 4px rgba(11,81,58,.1)}button{width:100%;height:52px;border:0;border-radius:11px;color:#fff;background:var(--green);font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.65}.message{display:none;margin-top:18px;padding:12px 14px;border-radius:11px;font-size:13px}.message.show{display:block}.success{color:#17633f;background:#eaf7ef}.error{color:#a12a2a;background:#fff0f0}.back{display:block;margin-top:22px;color:var(--green2);font-size:13px;font-weight:750;text-align:center;text-decoration:none}
</style></head><body><main class="card"><a href="/"><img src="/logo.png" alt="Elite Bridge"></a><h1>Reset your password</h1><p>Enter the email used for Elite Care or Elite Work. If an account exists, we will send a secure link that expires in 30 minutes.</p><form id="form"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><button id="submit" type="submit">Send reset link</button></form><div class="message success" id="success" role="status"></div><div class="message error" id="error" role="alert"></div><a class="back" href="/">Back to sign in</a></main><script>
const API_BASE='https://elite-bridge-shared-api-evans.vercel.app/api';const form=document.getElementById('form');form.addEventListener('submit',async(e)=>{e.preventDefault();const button=document.getElementById('submit');const success=document.getElementById('success');const error=document.getElementById('error');success.classList.remove('show');error.classList.remove('show');button.disabled=true;button.textContent='Sending…';try{const response=await fetch(`${API_BASE}/auth/forgot-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});const data=await response.json();if(!response.ok)throw new Error(data.message||data.error||'Unable to request a reset link.');success.textContent='If that account exists, a reset link has been sent. Check your email and spam folder.';success.classList.add('show');form.reset()}catch(err){error.textContent=err.message||'Please try again.';error.classList.add('show')}finally{button.disabled=false;button.textContent='Send reset link'}});
</script></body></html>
