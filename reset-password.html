<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Choose a new Elite Bridge password</title>
  <style>
    :root{--green:#063e2c;--green2:#0b513a;--ink:#15231d;--muted:#69766f;--line:#dfe7e3;--danger:#a12a2a;--success:#17633f}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;color:var(--ink);background:radial-gradient(circle at 10% 0,rgba(200,139,44,.18),transparent 30%),linear-gradient(145deg,#edf6f1,#f7f3eb);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .card{width:min(480px,100%);padding:34px;border:1px solid #e1e8e4;border-radius:22px;background:#fff;box-shadow:0 24px 70px rgba(18,43,33,.13)}
    img{width:185px;height:auto}
    h1{margin:30px 0 9px;color:var(--green);font-size:31px;letter-spacing:-.035em}
    p{color:var(--muted);line-height:1.55}
    .field{margin:18px 0}
    label{display:block;margin-bottom:8px;font-size:13px;font-weight:750}
    .input-wrap{position:relative}
    input{width:100%;height:52px;padding:0 70px 0 14px;border:1px solid var(--line);border-radius:11px;font:inherit}
    input:focus{outline:0;border-color:var(--green2);box-shadow:0 0 0 4px rgba(11,81,58,.1)}
    .show-password{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--green2);font-size:12px;font-weight:800;cursor:pointer}
    button[type=submit]{width:100%;height:52px;margin-top:7px;border:0;border-radius:11px;color:#fff;background:var(--green);font:inherit;font-weight:800;cursor:pointer}
    button:disabled{opacity:.65;cursor:not-allowed}
    .requirements{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:12px;line-height:1.5}
    .message{display:none;margin-top:18px;padding:12px 14px;border-radius:11px;font-size:13px}
    .message.show{display:block}
    .success{color:var(--success);background:#eaf7ef}
    .error{color:var(--danger);background:#fff0f0}
    .back{display:block;margin-top:22px;color:var(--green2);font-size:13px;font-weight:750;text-align:center;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <a href="/"><img src="/logo.png" alt="Elite Bridge"></a>
    <h1>Choose a new password</h1>
    <p>Use a strong password. After this works, we will sign you in automatically so you do not get stuck at the login page.</p>
    <form id="form">
      <div class="field">
        <label for="password">New password</label>
        <div class="input-wrap">
          <input id="password" type="password" minlength="8" autocomplete="new-password" required>
          <button class="show-password" type="button" data-toggle-password="password" aria-label="Show new password" aria-pressed="false">Show</button>
        </div>
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <div class="input-wrap">
          <input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
          <button class="show-password" type="button" data-toggle-password="confirm" aria-label="Show confirmation password" aria-pressed="false">Show</button>
        </div>
      </div>
      <ul class="requirements">
        <li>At least 8 characters</li>
        <li>Use something different from your old password</li>
      </ul>
      <button id="submit" type="submit">Update password and sign in</button>
    </form>
    <div class="message success" id="success" role="status"></div>
    <div class="message error" id="error" role="alert"></div>
    <a class="back" href="/">Back to sign in</a>
  </main>
<script>
const API_BASE='https://elite-bridge-shared-api-evans.vercel.app/api';
const token=new URLSearchParams(location.search).get('token');
const form=document.getElementById('form');
const success=document.getElementById('success');
const error=document.getElementById('error');
const submit=document.getElementById('submit');

function showError(message){error.textContent=message;error.classList.add('show');success.classList.remove('show')}
function showSuccess(message){success.textContent=message;success.classList.add('show');error.classList.remove('show')}
function passwordMeetsBaseline(value){return value.length>=8}

document.querySelectorAll('[data-toggle-password]').forEach((button)=>{
  button.addEventListener('click',()=>{
    const input=document.getElementById(button.dataset.togglePassword);
    const showing=input.type==='text';
    input.type=showing?'password':'text';
    button.textContent=showing?'Show':'Hide';
    button.setAttribute('aria-label',showing?'Show password':'Hide password');
    button.setAttribute('aria-pressed',String(!showing));
  });
});

if(!token){
  showError('This reset link is missing or invalid. Please request a new reset link.');
  submit.disabled=true;
}

form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirm').value;
  error.classList.remove('show');
  success.classList.remove('show');
  if(password!==confirm){showError('Passwords do not match.');return}
  if(!passwordMeetsBaseline(password)){showError('Use at least 8 characters.');return}
  submit.disabled=true;
  submit.textContent='Updating...';
  try{
    const response=await fetch(`${API_BASE}/auth/reset-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.message||data.error||'Unable to reset your password.');
    if(data.token&&data.user){
      localStorage.setItem('token',data.token);
      localStorage.setItem('user',JSON.stringify(data.user));
      showSuccess('Password updated. Opening your dashboard...');
      const role=data.user.role;
      const destination=role==='caregiver'?'/caregiver-dashboard':role==='employer'?'/employer-dashboard':'/marketplace';
      setTimeout(()=>window.location.assign(destination),800);
    }else{
      showSuccess(data.message||'Your password has been updated. You can now sign in.');
      form.hidden=true;
    }
  }catch(err){
    showError(err.message||'Please request a new reset link.');
    submit.disabled=false;
    submit.textContent='Update password and sign in';
  }
});
</script>
</body>
</html>
