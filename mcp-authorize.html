<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b3d2e">
  <title>Connect Elite Bridge | Elite Bridge Staffing</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18312a;background:#f3f7f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,520px);background:#fff;border:1px solid #dce8e0;border-radius:24px;padding:32px;box-shadow:0 18px 54px #173c2a12}.brand{font-size:16px;font-weight:800;color:#0b3d2e;letter-spacing:.01em}.eyebrow{margin:36px 0 8px;color:#a26a24;font-weight:750;font-size:12px;letter-spacing:.13em;text-transform:uppercase}h1{font-size:30px;line-height:1.15;margin:0 0 12px;letter-spacing:-.04em}p{line-height:1.55;color:#64716b;margin:0}.scopes{list-style:none;margin:24px 0;padding:0;border:1px solid #e4ece7;border-radius:14px;overflow:hidden}.scopes li{padding:14px 16px;border-bottom:1px solid #e4ece7;font-size:14px}.scopes li:last-child{border:0}.actions{display:flex;gap:12px;margin-top:24px}.actions button{flex:1;border:0;border-radius:12px;padding:14px 18px;font-size:15px;font-weight:750;cursor:pointer}.approve{background:#0b3d2e;color:white}.deny{background:#f2f5f3;color:#34463e}.message{margin-top:18px;font-size:14px}.error{color:#a33b31}.hidden{display:none}a{color:#0b6548;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">ELITE BRIDGE STAFFING</div>
    <div class="eyebrow">Secure connection</div>
    <h1>Connect your Elite Bridge workspace</h1>
    <p id="intro">Verifying the requesting MCP client and its requested permissions…</p>
    <ul class="scopes" id="scopeList"></ul>
    <div id="signIn" class="message hidden">Sign in to your Elite Bridge employer dashboard in another tab, then return here to approve the connection. <a href="/" target="_blank" rel="noopener">Open sign in</a></div>
    <div class="actions hidden" id="actions"><button class="deny" id="deny">Decline</button><button class="approve" id="approve">Approve connection</button></div>
    <div class="message" id="message" role="status"></div>
  </main>
  <script src="/mcp-authorize.js?v=elitebridge-mcp-20261010"></script>
</body>
</html>
