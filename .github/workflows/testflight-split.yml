name: Elite Bridge Split TestFlight

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app should be built and submitted to TestFlight?"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - caregiver
          - employer
  push:
    branches: [main]
    paths:
      - '.github/workflows/testflight-split.yml'

permissions:
  contents: read

concurrency:
  group: elite-bridge-split-testflight
  cancel-in-progress: false

jobs:
  caregiver:
    if: ${{ github.event_name == 'push' || github.event.inputs.app == 'both' || github.event.inputs.app == 'caregiver' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: elitebridge-mobile
    steps:
      - name: Checkout split branch
        uses: actions/checkout@v5
        with:
          ref: elitebridge-split-ai-ma

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up pnpm
        run: npm install --global pnpm@9.12.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare finalized caregiver icon and build number
        run: pnpm prepare:icons

      - name: Type check caregiver app
        run: pnpm check

      - name: Validate Expo configuration
        run: npx expo config --type public > /tmp/elitebridge-caregiver-expo-config.json

      - name: Prepare clean EAS upload and CocoaPods PATH workaround
        shell: bash
        run: |
          cat > scripts/eas-fix-pod-path.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${EAS_BUILD_PLATFORM:-}" = "ios" ]; then
            WORKING_ROOT="$(dirname "${EAS_BUILD_WORKINGDIR:-/Users/expo/workingdir/build}")"
            BIN_DIR="$WORKING_ROOT/bin"
            mkdir -p "$BIN_DIR"
            POD_SOURCE="$(ruby -e 'require "rubygems"; spec = Gem::Specification.find_by_name("cocoapods", "1.16.2"); puts File.join(spec.full_gem_path, "bin", "pod")')"
            echo "Linking existing CocoaPods executable into EAS PATH: $BIN_DIR/pod"
            test -f "$POD_SOURCE"
            {
              printf '%s\n' '#!/usr/bin/env bash'
              printf '%s\n' 'export COCOAPODS_NO_BUNDLER=1'
              printf '%s\n' 'unset BUNDLE_GEMFILE BUNDLE_BIN_PATH RUBYOPT RUBYLIB 2>/dev/null || true'
              printf 'exec ruby "%s" "$@"\n' "$POD_SOURCE"
            } > "$BIN_DIR/pod"
            chmod +x "$BIN_DIR/pod"
            "$BIN_DIR/pod" --version
          fi
          SH
          chmod +x scripts/eas-fix-pod-path.sh
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.devDependencies) delete pkg.devDependencies.sharp;
          pkg.scripts = pkg.scripts || {};
          pkg.scripts['eas-build-pre-install'] = 'bash scripts/eas-fix-pod-path.sh';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only --no-frozen-lockfile
          node -e "const p=require('./package.json'); if (p.devDependencies?.sharp || p.dependencies?.sharp) process.exit(1); if (!p.scripts?.['eas-build-pre-install']) process.exit(1)"
          echo 'Caregiver EAS upload package is clean and contains the CocoaPods PATH repair hook.'

      - name: Prepare Apple API key
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          test -n "$ASC_API_KEY_P8"
          printf '%s' "$ASC_API_KEY_P8" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8

      - name: Build caregiver iOS app and submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: /tmp/AuthKey.p8
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: F42HSPN3W4
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          CI: "1"
        run: npx eas-cli@latest build --platform ios --profile production --auto-submit --non-interactive

  employer:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'both' || github.event.inputs.app == 'employer') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: elitebridge-employer
    steps:
      - name: Checkout split branch
        uses: actions/checkout@v5
        with:
          ref: elitebridge-split-ai-ma

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up pnpm
        run: npm install --global pnpm@9.12.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare finalized employer icon
        run: pnpm prepare:icons

      - name: Type check employer app
        run: pnpm check

      - name: Validate Expo configuration
        run: npx expo config --type public > /tmp/elitebridge-employer-expo-config.json

      - name: Remove build-only image tooling from EAS upload
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.devDependencies) delete pkg.devDependencies.sharp;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only --no-frozen-lockfile
          node -e "const p=require('./package.json'); if (p.devDependencies?.sharp || p.dependencies?.sharp) process.exit(1)"

      - name: Prepare Apple API key
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          test -n "$ASC_API_KEY_P8"
          printf '%s' "$ASC_API_KEY_P8" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8

      - name: Prepare Employer App Store signing credentials
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
        run: |
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > /tmp/elitebridge-dist.p12
          chmod 600 /tmp/elitebridge-dist.p12
          python3 -m pip install --quiet pyjwt cryptography
          python3 scripts/prepare-ios-credentials.py
          node - <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.build.production.credentialsSource = 'local';
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2) + '\n');
          NODE

      - name: Build employer iOS app and submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: /tmp/AuthKey.p8
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: F42HSPN3W4
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          CI: "1"
        run: npx eas-cli@latest build --platform ios --profile production --auto-submit --non-interactive
