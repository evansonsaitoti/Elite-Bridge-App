name: Legacy caregiver TestFlight (manual only)

on:
  # Releases use testflight-split.yml, which prepares signing and both apps.
  # Keep this legacy entry point manual to prevent duplicate build submissions.
  workflow_dispatch:

concurrency:
  group: elite-bridge-testflight
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elitebridge-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Start iOS production build and TestFlight submission
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform ios --profile production --auto-submit --non-interactive --no-wait
