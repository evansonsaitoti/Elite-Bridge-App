name: Employer App Quality

on:
  pull_request:
    paths:
      - "elitebridge-employer/**"
      - ".github/workflows/employer-quality.yml"
  push:
    branches:
      - elitebridge-split-ai-ma
    paths:
      - "elitebridge-employer/**"
      - ".github/workflows/employer-quality.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elitebridge-employer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript check
        run: pnpm check
