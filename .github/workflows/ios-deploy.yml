name: iOS Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ios-deploy.yml'

concurrency:
  group: ios-testflight-direct
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout split caregiver release
        uses: actions/checkout@v5
        with:
          ref: elitebridge-split-ai-ma

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install --global pnpm@9.12.0

      - name: Verify required secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ASC_P8_KEY: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
        shell: bash
        run: |
          for secret_name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD ASC_P8_KEY ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required GitHub secret: $secret_name"
              exit 1
            fi
          done

      - name: Install JavaScript dependencies
        working-directory: elitebridge-mobile
        run: pnpm install --no-frozen-lockfile

      - name: Prepare finalized caregiver branding and native version
        working-directory: elitebridge-mobile
        run: pnpm prepare:icons

      - name: Type check caregiver
        working-directory: elitebridge-mobile
        run: pnpm check

      - name: Install Fastlane and CocoaPods
        run: |
          command -v fastlane >/dev/null 2>&1 || brew install fastlane
          command -v pod >/dev/null 2>&1 || brew install cocoapods
          fastlane --version
          pod --version

      - name: Install Apple Distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install iOS dependencies
        working-directory: elitebridge-mobile/ios
        env:
          COCOAPODS_DISABLE_STATS: "true"
        run: pod install --repo-update

      - name: Prepare App Store Connect API key
        env:
          ASC_P8_KEY: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
        shell: bash
        run: |
          P8_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_P8_KEY" > "$P8_PATH"
          chmod 600 "$P8_PATH"
          echo "APP_STORE_CONNECT_KEY_PATH=$P8_PATH" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"

      - name: Build, sign, and upload caregiver to TestFlight
        working-directory: elitebridge-mobile/ios
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          APPLE_TEAM_ID: F42HSPN3W4
        run: fastlane beta

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
          if [ -n "${APP_STORE_CONNECT_KEY_PATH:-}" ]; then
            rm -f "$APP_STORE_CONNECT_KEY_PATH"
          fi
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          rm -f "elitebridge-mobile/ios/EliteBridgeAdmin_CI.mobileprovision"
