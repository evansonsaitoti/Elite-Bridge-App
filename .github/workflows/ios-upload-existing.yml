name: Upload existing Elite Bridge iOS builds to TestFlight

on:
  workflow_dispatch:
    inputs:
      employer_ipa_url:
        description: "Existing signed Elite Work build 38 IPA URL"
        required: true
        type: string
        default: "https://expo.dev/artifacts/eas/-6kVCkDA_JPY6vz6l7sKoQAaMoOA72XfdCYnmRbM82c.ipa"
      care_build_run_id:
        description: "GitHub Actions run containing the existing signed Elite Care build 62"
        required: true
        type: string
        default: "38176230013"

permissions:
  contents: read
  actions: read

concurrency:
  group: elite-bridge-existing-ios-testflight
  cancel-in-progress: false

jobs:
  employer:
    name: Submit existing Elite Work build 38
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install --global pnpm@9.12.0

      - name: Install app dependencies
        working-directory: elitebridge-employer
        run: pnpm install --no-frozen-lockfile

      - name: Download existing signed IPA
        env:
          IPA_URL: ${{ inputs.employer_ipa_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/EliteWork-38.ipa" "$IPA_URL"
          test -s "$RUNNER_TEMP/EliteWork-38.ipa"

      - name: Verify signed IPA identity and build number
        run: |
          python3 - "$RUNNER_TEMP/EliteWork-38.ipa" com.app.elitebridgeemployer 38 <<'PY'
          import plistlib, sys, zipfile
          path, expected_bundle, expected_build = sys.argv[1:]
          with zipfile.ZipFile(path) as ipa:
              plist_path = next((n for n in ipa.namelist() if n.endswith(".app/Info.plist")), None)
              if not plist_path:
                  raise SystemExit("No app Info.plist found in IPA")
              info = plistlib.loads(ipa.read(plist_path))
          actual = (info.get("CFBundleIdentifier"), str(info.get("CFBundleVersion")))
          expected = (expected_bundle, expected_build)
          if actual != expected:
              raise SystemExit(f"IPA identity mismatch: got {actual}, expected {expected}")
          print(f"Verified {actual[0]} build {actual[1]}")
          PY

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          test -n "$ASC_API_KEY_P8"
          printf '%s' "$ASC_API_KEY_P8" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8

      - name: Submit existing build to TestFlight
        working-directory: elitebridge-employer
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: /tmp/AuthKey.p8
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: F42HSPN3W4
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          CI: "1"
        run: npx eas-cli@latest submit --platform ios --path "$RUNNER_TEMP/EliteWork-38.ipa" --profile production --non-interactive --wait

      - name: Remove temporary App Store Connect API key
        if: always()
        run: rm -f /tmp/AuthKey.p8

  care:
    name: Submit existing Elite Care build 62
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install --global pnpm@9.12.0

      - name: Install app dependencies
        working-directory: elitebridge-employer
        run: pnpm install --no-frozen-lockfile

      - name: Download existing signed Care IPA from the completed build run
        uses: actions/download-artifact@v4
        with:
          name: elite-care-ios-build-62
          path: ${{ runner.temp }}/elite-care-build-62
          repository: evansonsaitoti/Elite-Bridge-App
          run-id: ${{ inputs.care_build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signed IPA identity and build number
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/elite-care-build-62" -maxdepth 2 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          echo "CARE_IPA=$IPA" >> "$GITHUB_ENV"
          python3 - "$IPA" com.app.elitebridgemobile 62 <<'PY'
          import plistlib, sys, zipfile
          path, expected_bundle, expected_build = sys.argv[1:]
          with zipfile.ZipFile(path) as ipa:
              plist_path = next((n for n in ipa.namelist() if n.endswith(".app/Info.plist")), None)
              if not plist_path:
                  raise SystemExit("No app Info.plist found in IPA")
              info = plistlib.loads(ipa.read(plist_path))
          actual = (info.get("CFBundleIdentifier"), str(info.get("CFBundleVersion")))
          expected = (expected_bundle, expected_build)
          if actual != expected:
              raise SystemExit(f"IPA identity mismatch: got {actual}, expected {expected}")
          print(f"Verified {actual[0]} build {actual[1]}")
          PY

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          test -n "$ASC_API_KEY_P8"
          printf '%s' "$ASC_API_KEY_P8" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8

      - name: Submit existing build to TestFlight
        working-directory: elitebridge-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest submit --platform ios --path "$CARE_IPA" --profile production --non-interactive --wait
