name: Elite Care iOS push credential diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/elite-care-push-diagnostics.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Expo account and iOS push-credential metadata (no secrets output)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN: missing"
            exit 1
          fi
          node <<'NODE'
          const token = process.env.EXPO_TOKEN;
          const query = 'query PushDiagnostics($id: String!) { app { byId(appId: $id) { id name slug ownerAccount { name } } } }';
          (async () => {
            const response = await fetch('https://api.expo.dev/graphql', {
              method: 'POST',
              headers: {'Content-Type':'application/json', 'Authorization':'Bearer ' + token},
              body: JSON.stringify({query,variables:{id:'15715728-ffc5-4ea1-9da8-5158f1e539ef'}})
            });
            const body = await response.json();
            if (body.errors?.length) {
              for (const error of body.errors) console.log('EXPO_API_DIAGNOSTIC:', error.message.slice(0,220));
              process.exitCode=1;return;
            }
            console.log('EXPO_API_ACCESS:', response.status);
            console.log('PROJECT_MATCH:', body.data?.app?.byId?.id === '15715728-ffc5-4ea1-9da8-5158f1e539ef');
            console.log('PROJECT_OWNER:', body.data?.app?.byId?.ownerAccount?.name || 'unavailable');
            const gql = async (query) => {
              const r = await fetch('https://api.expo.dev/graphql', {
                method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + token},
                body:JSON.stringify({query})
              });
              const j = await r.json();
              if (j.errors) console.log('INTROSPECTION_ERRORS:', j.errors.map(e => e.message.slice(0,100)));
              return j.data;
            };
            const t = (await gql('{ __type(name:"App") { fields { name type { name kind ofType { name kind ofType { name kind } } } args { name type { name kind ofType { name } } } } } }'))?.__type;
            const field = t?.fields?.find(f => f.name === 'iosAppCredentials');
            console.log('IOS_APP_CREDENTIAL_FIELD:', JSON.stringify(field));
            const names = ['IosAppCredentials','IosPushKey','ApplePushKey','IosAppBuildCredentials','IosAppCredentialsQuery','IosAppCredentialsMutation'];
            for (const name of names) {
              const entry = (await gql(`{ __type(name:"${name}") { name fields { name type { name kind ofType { name kind } } } } }`))?.__type;
              if (entry) console.log('INTROSPECT_TYPE:', name,entry.fields?.map(f=>f.name).join(','));
            }
            const creds = await gql(`query {
              app { byId(appId:"15715728-ffc5-4ea1-9da8-5158f1e539ef") {
                iosAppCredentials { id pushKey { id keyIdentifier }
                  iosAppBuildCredentialsList { id } }
              } }
            }`);
            console.log('EXPO_IOS_APP_CREDENTIALS_SUMMARY:',JSON.stringify((creds?.app?.byId?.iosAppCredentials||[]).map(c=>({
              configured:true,pushKeyAttached:!!c.pushKey,buildCredentialCount:c.iosAppBuildCredentialsList?.length||0
            }))));
            const input = (await gql('{ __type(name:"IosAppCredentialsFilter") { inputFields { name type { name kind ofType { name kind } } } } }'))?.__type;
            console.log('CREDENTIAL_FILTER_FIELDS:',input?.inputFields?.map(f=>f.name).join(',')||'unavailable');
            for (const n of ['IosAppCredentialsMutation','Account','AppleTeam','AppleAppIdentifier']) {
              const d = (await gql(`{ __type(name:"${n}") { fields { name args { name type { name kind ofType { name kind } } } type { name kind ofType { name kind } } } } }`))?.__type;
              if (n === 'IosAppCredentialsMutation') console.log('SET_PUSH_KEY_ARGS:',JSON.stringify(d?.fields?.find(f=>f.name==='setPushKey')||null));
              else console.log('CREDENTIAL_TYPE_FIELDS:',n,d?.fields?.filter(f=>/push|key|apple|bundle|account/i.test(f.name)).map(f=>({name:f.name,type:f.type}))||[]);
            }
            const list = await gql(`query { app { byId(appId:"15715728-ffc5-4ea1-9da8-5158f1e539ef") {
              iosAppCredentials { id pushKey { id } appleTeam { id } appleAppIdentifier { id } }
            } } }`);
            console.log('IOS_ASSOCIATION_IDS:',JSON.stringify((list?.app?.byId?.iosAppCredentials||[]).map(c=>({id:c.id,teamId:c.appleTeam?.id,identifierId:c.appleAppIdentifier?.id,pushAttached:!!c.pushKey}))));
            const candidates=await gql(`query { app { byId(appId:"15715728-ffc5-4ea1-9da8-5158f1e539ef") {
              iosAppCredentials { id appleAppIdentifier { bundleIdentifier }
                appleTeam { id appleTeamIdentifier applePushKeys { id keyIdentifier } } pushKey { id keyIdentifier } }
            } } }`);
            console.log('PUSH_KEY_REUSE_CANDIDATES:',JSON.stringify((candidates?.app?.byId?.iosAppCredentials||[]).map(c=>({
              bundle:c.appleAppIdentifier?.bundleIdentifier||'unknown',
              team:c.appleTeam?.appleTeamIdentifier||'none',
              availableOnTeam:c.appleTeam?.applePushKeys?.length||0,
              alreadyAssigned:!!c.pushKey
            }))));
            const owner = (await gql('{ __type(name:"Account") { fields { name args { name type {name kind ofType{name kind}} } type {name kind ofType{name kind ofType{name kind}}} } } }'))?.__type?.fields?.find(f=>f.name==="applePushKeysPaginated");
            console.log('ACCOUNT_KEYS_FIELD:', JSON.stringify(owner));
            const keyTypeName = owner?.type?.ofType?.name || owner?.type?.ofType?.ofType?.name || owner?.type?.name;
            if (keyTypeName) {
              const t = (await gql(`{ __type(name:"${keyTypeName}") { fields { name type {name kind ofType{name kind}} } } }`))?.__type;
              console.log('ACCOUNT_KEY_LIST_TYPE:', keyTypeName,t?.fields?.map(f=>f.name)||[]);
            }




          })().catch(e=>{ console.error('DIAGNOSTIC_ERROR:', String(e.message).slice(0,200)); process.exitCode=1;});
          NODE
