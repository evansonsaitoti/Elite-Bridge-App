name: Shared Backend Quality

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"
  push:
    branches:
      - elitebridge-split-ai-ma
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm 10 can crash while resolving the Vitest peer dependency graph.
      - name: Use tested npm version
        run: npm install --global npm@11.9.0

      - name: Install locked dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Test isolated backend workflows
        run: npm test
