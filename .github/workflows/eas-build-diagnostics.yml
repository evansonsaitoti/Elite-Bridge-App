name: EAS Failed Build Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eas-build-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-eas-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout split branch
        uses: actions/checkout@v5
        with:
          ref: elitebridge-split-ai-ma

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up pnpm
        run: npm install --global pnpm@9.12.0

      - name: Install caregiver dependencies for EAS CLI config resolution
        working-directory: elitebridge-mobile
        run: pnpm install --no-frozen-lockfile

      - name: Install employer dependencies for EAS CLI config resolution
        working-directory: elitebridge-employer
        run: pnpm install --no-frozen-lockfile

      - name: Fetch and decode caregiver EAS logs
        working-directory: elitebridge-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          mkdir -p /tmp/eas-current/caregiver
          npx eas-cli@latest build:view a82b3fe2-5fd5-4170-9f44-e767bb86f67b --json > /tmp/caregiver-build.json
          node - <<'NODE'
          const fs = require('fs');
          const https = require('https');
          const http = require('http');
          const zlib = require('zlib');
          const data = JSON.parse(fs.readFileSync('/tmp/caregiver-build.json','utf8'));
          console.log('CAREGIVER STATUS:', data.status);
          console.log('CAREGIVER ERROR:', JSON.stringify(data.error || null));
          const urls=[];
          function walk(v,p='root') {
            if (Array.isArray(v)) return v.forEach((x,i)=>walk(x,`${p}[${i}]`));
            if (v && typeof v === 'object') return Object.entries(v).forEach(([k,x])=>walk(x,`${p}.${k}`));
            if (typeof v === 'string' && /^https?:/.test(v) && p.toLowerCase().includes('log')) urls.push([p,v]);
          }
          walk(data);
          function fetch(url) { return new Promise((resolve,reject)=>{ const lib=url.startsWith('https:')?https:http; lib.get(url,r=>{ if(r.statusCode>=300&&r.statusCode<400&&r.headers.location) return fetch(r.headers.location).then(resolve,reject); const chunks=[]; r.on('data',c=>chunks.push(c)); r.on('end',()=>resolve(Buffer.concat(chunks))); r.on('error',reject); }).on('error',reject); }); }
          (async()=>{
            for (let i=0;i<urls.length;i++) {
              const [path,url]=urls[i];
              let body=await fetch(url);
              try { body=zlib.brotliDecompressSync(body); } catch {}
              fs.writeFileSync(`/tmp/eas-current/caregiver/log-${i}.txt`, body);
              console.log(`Downloaded caregiver log ${i} from ${path}: ${body.length} bytes decoded`);
            }
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE
          echo '=== CAREGIVER DEPENDENCY ERROR RECORDS ==='
          grep -RniE 'INSTALL_DEPENDENCIES|Install dependencies|ERR_|ELIFECYCLE|error|failed|failure|pnpm|corepack|node_modules|lockfile|packageManager|Unsupported|Cannot|ENOENT' /tmp/eas-current/caregiver | tail -n 350 || true

      - name: Fetch and decode employer EAS logs
        working-directory: elitebridge-employer
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          mkdir -p /tmp/eas-current/employer
          npx eas-cli@latest build:view 03f54d4e-43f9-44ba-87f2-46b3e464e8f1 --json > /tmp/employer-build.json
          node - <<'NODE'
          const fs = require('fs');
          const https = require('https');
          const http = require('http');
          const zlib = require('zlib');
          const data = JSON.parse(fs.readFileSync('/tmp/employer-build.json','utf8'));
          console.log('EMPLOYER STATUS:', data.status);
          console.log('EMPLOYER ERROR:', JSON.stringify(data.error || null));
          const urls=[];
          function walk(v,p='root') {
            if (Array.isArray(v)) return v.forEach((x,i)=>walk(x,`${p}[${i}]`));
            if (v && typeof v === 'object') return Object.entries(v).forEach(([k,x])=>walk(x,`${p}.${k}`));
            if (typeof v === 'string' && /^https?:/.test(v) && p.toLowerCase().includes('log')) urls.push([p,v]);
          }
          walk(data);
          function fetch(url) { return new Promise((resolve,reject)=>{ const lib=url.startsWith('https:')?https:http; lib.get(url,r=>{ if(r.statusCode>=300&&r.statusCode<400&&r.headers.location) return fetch(r.headers.location).then(resolve,reject); const chunks=[]; r.on('data',c=>chunks.push(c)); r.on('end',()=>resolve(Buffer.concat(chunks))); r.on('error',reject); }).on('error',reject); }); }
          (async()=>{
            for (let i=0;i<urls.length;i++) {
              const [path,url]=urls[i];
              let body=await fetch(url);
              try { body=zlib.brotliDecompressSync(body); } catch {}
              fs.writeFileSync(`/tmp/eas-current/employer/log-${i}.txt`, body);
              console.log(`Downloaded employer log ${i} from ${path}: ${body.length} bytes decoded`);
            }
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE
          echo '=== EMPLOYER DEPENDENCY ERROR RECORDS ==='
          grep -RniE 'INSTALL_DEPENDENCIES|Install dependencies|ERR_|ELIFECYCLE|error|failed|failure|pnpm|corepack|node_modules|lockfile|packageManager|Unsupported|Cannot|ENOENT' /tmp/eas-current/employer | tail -n 350 || true

      - name: Upload decoded logs
        uses: actions/upload-artifact@v4
        with:
          name: current-eas-dependency-logs
          path: /tmp/eas-current
          if-no-files-found: warn
          retention-days: 2
