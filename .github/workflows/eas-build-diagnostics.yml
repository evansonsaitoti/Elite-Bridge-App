name: EAS Failed Build Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eas-build-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caregiver-pods:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout split branch
        uses: actions/checkout@v5
        with:
          ref: elitebridge-split-ai-ma

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up pnpm
        run: npm install --global pnpm@9.12.0

      - name: Install caregiver dependencies for EAS config
        working-directory: elitebridge-mobile
        run: pnpm install --no-frozen-lockfile

      - name: Fetch and decode caregiver pod install logs
        working-directory: elitebridge-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          mkdir -p /tmp/eas-caregiver-pods
          npx eas-cli@latest build:view 20da8a2f-0b70-4772-ae7f-e9253315a8ec --json > /tmp/caregiver-build.json
          node - <<'NODE'
          const fs=require('fs'), https=require('https'), http=require('http'), zlib=require('zlib');
          const data=JSON.parse(fs.readFileSync('/tmp/caregiver-build.json','utf8'));
          console.log('STATUS:',data.status); console.log('ERROR:',JSON.stringify(data.error||null));
          const urls=[]; function walk(v,p='root'){if(Array.isArray(v))return v.forEach((x,i)=>walk(x,`${p}[${i}]`));if(v&&typeof v==='object')return Object.entries(v).forEach(([k,x])=>walk(x,`${p}.${k}`));if(typeof v==='string'&&/^https?:/.test(v)&&p.toLowerCase().includes('log'))urls.push([p,v]);} walk(data);
          function fetch(url){return new Promise((resolve,reject)=>{const lib=url.startsWith('https:')?https:http;lib.get(url,r=>{if(r.statusCode>=300&&r.statusCode<400&&r.headers.location)return fetch(r.headers.location).then(resolve,reject);const chunks=[];r.on('data',c=>chunks.push(c));r.on('end',()=>resolve(Buffer.concat(chunks)));r.on('error',reject);}).on('error',reject);});}
          (async()=>{for(let i=0;i<urls.length;i++){const [path,url]=urls[i];let body=await fetch(url);try{body=zlib.brotliDecompressSync(body);}catch{}fs.writeFileSync(`/tmp/eas-caregiver-pods/log-${i}.txt`,body);console.log(`Downloaded ${i} ${path}: ${body.length}`);}})().catch(e=>{console.error(e);process.exit(1);});
          NODE
          echo '=== POD INSTALL FAILURE ==='
          grep -RniE 'INSTALL_PODS|pod install|\[!\]|CocoaPods|Unable to find|could not find|No podspec|incompatible|deployment target|Xcodeproj|ArgumentError|NoMethodError|LoadError|Errno|error|failed|failure|Hermes|React|ExpoModules|autolinking|script_phases|modular|static|Swift|duplicate' /tmp/eas-caregiver-pods | tail -n 700 || true
