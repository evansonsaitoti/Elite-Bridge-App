name: EAS Failed Build Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eas-build-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout split branch
        uses: actions/checkout@v5
        with:
          ref: elitebridge-split-ai-ma

      - name: Verify caregiver uses one package manager
        shell: bash
        run: |
          test -f elitebridge-mobile/pnpm-lock.yaml
          test ! -f elitebridge-mobile/package-lock.json
          echo 'Caregiver package manager: pnpm only ✅'

      - name: Prepare Apple API key
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          test -n "$ASC_API_KEY_P8"
          printf '%s' "$ASC_API_KEY_P8" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8

      - name: Validate Employer P12 has private signing key
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > /tmp/elitebridge-dist.p12
          chmod 600 /tmp/elitebridge-dist.p12
          openssl pkcs12 -in /tmp/elitebridge-dist.p12 -clcerts -nokeys -passin "pass:$P12_PASSWORD" -out /tmp/dist-cert.pem >/dev/null 2>&1
          openssl pkcs12 -in /tmp/elitebridge-dist.p12 -nocerts -nodes -passin "pass:$P12_PASSWORD" -out /tmp/dist-key.pem >/dev/null 2>&1
          test -s /tmp/dist-cert.pem
          test -s /tmp/dist-key.pem
          cert_pub=$(openssl x509 -in /tmp/dist-cert.pem -pubkey -noout | openssl pkey -pubin -outform DER 2>/dev/null | sha256sum | cut -d' ' -f1)
          key_pub=$(openssl pkey -in /tmp/dist-key.pem -pubout -outform DER 2>/dev/null | sha256sum | cut -d' ' -f1)
          test "$cert_pub" = "$key_pub"
          echo 'Employer P12: certificate + matching private key ✅'

      - name: Generate and validate Employer App Store profile
        shell: bash
        working-directory: elitebridge-employer
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 scripts/prepare-ios-credentials.py
          openssl smime -inform der -verify -noverify -in /tmp/elitebridge-employer.mobileprovision -out /tmp/profile.plist >/dev/null 2>&1
          python3 - <<'PY'
          import plistlib, subprocess, tempfile, pathlib
          profile = plistlib.loads(pathlib.Path('/tmp/profile.plist').read_bytes())
          app_id = profile.get('Entitlements', {}).get('application-identifier', '')
          assert app_id.endswith('.com.app.elitebridgeemployer'), app_id
          certs = profile.get('DeveloperCertificates', [])
          assert certs, 'No DeveloperCertificates in provisioning profile'
          with tempfile.NamedTemporaryFile(suffix='.der') as f:
              f.write(certs[0]); f.flush()
              embedded = subprocess.check_output(['openssl','x509','-inform','der','-in',f.name,'-noout','-serial']).decode().strip().split('=',1)[1].lstrip('0').upper()
          local = subprocess.check_output(['openssl','x509','-in','/tmp/dist-cert.pem','-noout','-serial']).decode().strip().split('=',1)[1].lstrip('0').upper()
          assert embedded == local, (embedded, local)
          print('Employer profile: bundle ID + distribution certificate match ✅')
          PY

      - name: Verify credentials.json paths are readable
        shell: bash
        working-directory: elitebridge-employer
        run: |
          python3 - <<'PY'
          import json, pathlib
          data=json.loads(pathlib.Path('credentials.json').read_text())['ios']
          assert pathlib.Path(data['provisioningProfilePath']).is_file()
          assert pathlib.Path(data['distributionCertificate']['path']).is_file()
          print('Employer local credentials files readable by EAS CLI ✅')
          PY
