name: iOS build only

on:
  push:
    branches:
      - build/ios-only-20261011

permissions:
  contents: read

concurrency:
  group: ios-build-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build signed iOS apps (no submission)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify signing secrets and prepare Apple API key
        env:
          ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          for secret_name in ASC_API_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID BUILD_CERTIFICATE_BASE64 P12_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required signing secret: $secret_name" >&2
              exit 1
            fi
          done
          printf '%s' "$ASC_API_KEY_P8" > /tmp/AuthKey.p8
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > /tmp/elitebridge-dist.p12
          chmod 600 /tmp/AuthKey.p8 /tmp/elitebridge-dist.p12
          {
            echo "EXPO_ASC_API_KEY_PATH=/tmp/AuthKey.p8"
            echo "EXPO_ASC_KEY_ID=$ASC_KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$ASC_ISSUER_ID"
            echo "EXPO_APPLE_TEAM_ID=F42HSPN3W4"
            echo "EXPO_APPLE_TEAM_TYPE=INDIVIDUAL"
          } >> "$GITHUB_ENV"

      - name: Validate Employer app
        working-directory: elitebridge-employer
        env:
          EXPO_PUBLIC_API_URL: https://elite-bridge-shared-api-evans.vercel.app
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm audit:release

      - name: Prepare Employer signing credentials
        working-directory: elitebridge-employer
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          IOS_BUNDLE_IDENTIFIER: com.app.elitebridgeemployer
          IOS_APP_LABEL: Employer
          IOS_PROFILE_PATH: /tmp/elitebridge-employer.mobileprovision
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 scripts/prepare-ios-credentials.py
          node - <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.build.production.credentialsSource = 'local';
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2) + '\n');
          NODE

      - name: Build Employer iOS app
        working-directory: elitebridge-employer
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          CI: "1"
        run: pnpm dlx eas-cli@latest build --platform ios --profile production --non-interactive

      - name: Prepare and validate Care app
        if: ${{ !cancelled() }}
        id: care_validation
        working-directory: elitebridge-mobile
        env:
          EXPO_PUBLIC_API_URL: https://elite-bridge-shared-api-evans.vercel.app
        run: |
          pnpm install --frozen-lockfile
          pnpm prepare:icons
          pnpm check
          pnpm audit:release

      - name: Prepare Care signing credentials
        if: ${{ !cancelled() && steps.care_validation.outcome == 'success' }}
        working-directory: elitebridge-mobile
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          IOS_BUNDLE_IDENTIFIER: com.app.elitebridgemobile
          IOS_APP_LABEL: Caregiver
          IOS_PROFILE_PATH: /tmp/elitebridge-caregiver.mobileprovision
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 ../elitebridge-employer/scripts/prepare-ios-credentials.py
          node - <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.build.production.credentialsSource = 'local';
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2) + '\n');
          NODE

      - name: Build Care iOS app
        if: ${{ !cancelled() && steps.care_validation.outcome == 'success' }}
        working-directory: elitebridge-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          CI: "1"
        run: pnpm dlx eas-cli@latest build --platform ios --profile production --non-interactive

      - name: Remove temporary signing material
        if: ${{ always() }}
        run: |
          rm -f /tmp/AuthKey.p8 /tmp/elitebridge-dist.p12 /tmp/elitebridge-dist-compatible.p12
          rm -f /tmp/elitebridge-dist-cert.pem /tmp/elitebridge-dist-key.pem
          rm -f /tmp/elitebridge-employer.mobileprovision /tmp/elitebridge-caregiver.mobileprovision
          rm -f elitebridge-employer/credentials.json elitebridge-mobile/credentials.json
